<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>mynet</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='28' fill='%23000'/%3E%3Cg transform='translate(21 21) scale(.65)' fill='none'%3E%3Cpath d='M22 98V58a19 19 0 0 1 38 0v40M60 58a19 19 0 0 1 38 0v40' stroke='%23fff' stroke-width='15' stroke-linecap='round'/%3E%3Ccircle cx='98' cy='20' r='9' fill='%23B9FF4B'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one narrow feed column under a sticky bar; the sign-in screen is a single glass card over a lime glow. */
:root{
  --bg:#000000; --panel:rgba(18,18,20,.72); --panel-2:rgba(39,39,42,.6); --line:#34343a;
  --text:#ffffff; --soft:#d4d4d8; --muted:#a1a1aa; --dim:#71717a;
  --accent:#B9FF4B; --accent-ink:#0b1400; --like:#fb7185; --save:#facc15; --danger:#f87171;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#030503;color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- gradient mesh background ---------- */
.mesh{position:fixed;inset:0;z-index:0;overflow:hidden;background:#030503;pointer-events:none}
.blob{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(80px);opacity:.85;will-change:transform}
.blob.b1{background:radial-gradient(circle at center,#B9FF4B 0,rgba(185,255,75,0) 65%);top:-22vmax;left:-14vmax;animation:m1 8s ease-in-out infinite}
.blob.b2{background:radial-gradient(circle at center,#0f9f6e 0,rgba(15,159,110,0) 65%);top:-10vmax;right:-24vmax;animation:m2 8s ease-in-out infinite}
.blob.b3{background:radial-gradient(circle at center,#1e8fd8 0,rgba(30,143,216,0) 65%);bottom:-28vmax;left:8vmax;animation:m3 8s ease-in-out infinite}
.blob.b4{background:radial-gradient(circle at center,#6d3fe0 0,rgba(109,63,224,0) 65%);bottom:-24vmax;right:-12vmax;animation:m4 8s ease-in-out infinite}
@keyframes m1{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(18vw,10vh) scale(1.12)}50%{transform:translate(30vw,26vh) scale(.92)}75%{transform:translate(8vw,20vh) scale(1.05)}}
@keyframes m2{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(-20vw,16vh) scale(.9)}50%{transform:translate(-30vw,4vh) scale(1.15)}75%{transform:translate(-10vw,-6vh) scale(1)}}
@keyframes m3{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(22vw,-12vh) scale(1.1)}50%{transform:translate(8vw,-28vh) scale(.95)}75%{transform:translate(-8vw,-10vh) scale(1.08)}}
@keyframes m4{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(-14vw,-20vh) scale(1.05)}50%{transform:translate(-28vw,-8vh) scale(1.15)}75%{transform:translate(-6vw,6vh) scale(.9)}}
.grain{position:absolute;inset:-50%;opacity:.08;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px 180px;animation:grain 1s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}100%{transform:translate(0,0)}}
.mesh::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.12);transition:background .6s}
body.in-app .mesh::after{background:rgba(0,0,0,.42)}
#auth,#app,#boot{position:relative;z-index:1}

/* ---------- sign-in screen ---------- */
#auth{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:32px 16px;overflow:hidden}
.card-wrap{position:relative;z-index:1;width:100%;max-width:384px;perspective:1500px;animation:rise .8s ease both}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.tilt{position:relative;transition:transform .15s ease-out;transform-style:preserve-3d}
.beams{position:absolute;inset:-1px;border-radius:16px;overflow:hidden;pointer-events:none}
.beam{position:absolute;opacity:.6;filter:blur(1.5px)}
.beam.t,.beam.b{height:3px;width:50%;background:linear-gradient(to right,transparent,#fff,transparent)}
.beam.r,.beam.l{width:3px;height:50%;background:linear-gradient(to bottom,transparent,#fff,transparent)}
.beam.t{top:0;animation:bx 3.5s ease-in-out infinite}
.beam.r{right:0;animation:by 3.5s ease-in-out .6s infinite backwards}
.beam.b{bottom:0;animation:bx 3.5s ease-in-out 1.2s infinite reverse backwards}
.beam.l{left:0;animation:by 3.5s ease-in-out 1.8s infinite reverse backwards}
@keyframes bx{0%{left:-50%}70%,100%{left:100%}}
@keyframes by{0%{top:-50%}70%,100%{top:100%}}
.glass{position:relative;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:24px;box-shadow:0 25px 50px -12px rgba(0,0,0,.6)}
.auth-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:20px}
.auth-logo{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(255,255,255,.1),transparent);margin-bottom:6px}
.auth-head h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.3px}
.auth-head p{margin:0;font-size:12px;color:rgba(255,255,255,.6)}
#auth-form{display:flex;flex-direction:column;gap:12px}
.field{position:relative;display:flex;align-items:center;transition:transform .2s}
.field:hover{transform:scale(1.01)}
.field svg.i{position:absolute;left:12px;width:16px;height:16px;color:rgba(255,255,255,.4);transition:color .3s}
.field:focus-within svg.i{color:#fff}
.field input{width:100%;height:40px;border-radius:8px;border:1px solid transparent;background:rgba(255,255,255,.05);padding:0 12px 0 38px;font-size:14px;outline:none;transition:background .3s,border-color .3s}
.field input::placeholder{color:rgba(255,255,255,.3)}
.field input:focus{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.field .at{position:absolute;left:13px;font-size:14px;font-weight:700;color:rgba(255,255,255,.4)}
.field .eye{position:absolute;right:6px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4);border-radius:6px}
.field .eye:hover{color:#fff}
.field .eye svg.i{position:static;color:inherit}
.auth-row{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.6);padding-top:2px}
.auth-row input{appearance:none;-webkit-appearance:none;width:16px;height:16px;margin:0;border-radius:4px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);display:grid;place-items:center;cursor:pointer}
.auth-row input:checked{background:#fff;border-color:#fff}
.auth-row input:checked::after{content:"";width:8px;height:4px;border-left:2px solid #000;border-bottom:2px solid #000;transform:rotate(-45deg) translateY(-1px)}
.auth-row label{cursor:pointer}
.btn-main{height:40px;border-radius:8px;background:#fff;color:#000;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;transition:transform .15s,box-shadow .3s}
.btn-main:hover{transform:scale(1.02);box-shadow:0 0 24px rgba(255,255,255,.18)}
.btn-main:active{transform:scale(.98)}
.btn-main:disabled{opacity:.7;cursor:wait}
.btn-main svg.i{width:14px;height:14px;transition:transform .3s}
.btn-main:hover svg.i{transform:translateX(3px)}
.spin{width:16px;height:16px;border:2px solid rgba(0,0,0,.7);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.auth-msg{font-size:12.5px;border-radius:8px;padding:8px 10px;background:rgba(248,113,113,.12);color:#fecaca;border:1px solid rgba(248,113,113,.25)}
.auth-msg.ok{background:rgba(185,255,75,.1);color:#e3ffb5;border-color:rgba(185,255,75,.25)}
.auth-switch{text-align:center;font-size:12px;color:rgba(255,255,255,.6);margin:14px 0 0}
.auth-switch button{color:#fff;font-weight:700;border-bottom:1px solid transparent;transition:border-color .3s}
.auth-switch button:hover{border-color:#fff}
.hint{font-size:11.5px;color:rgba(255,255,255,.45);margin:-6px 2px 0}

/* ---------- app shell ---------- */
.bar{position:sticky;top:0;z-index:10;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);animation:drop .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
.bar-in{max-width:592px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.8px;border-radius:12px}
.brand svg{transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.brand:hover svg{transform:rotate(-12deg) scale(1.12)}
.brand:hover circle{animation:dot .6s ease}
@keyframes dot{40%{transform:translateY(-8px)}}
.brand circle{transform-box:fill-box;transform-origin:center}

/* nav: round icons that fill with color from the bottom, tooltip slides in below */
.nav{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.tip-item{position:relative}
.tip-btn{position:relative;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--soft);transition:box-shadow .3s ease,transform .2s ease,color .3s ease}
.tip-btn .fill{position:absolute;left:0;bottom:0;width:100%;height:0;background:var(--c);transition:height .3s ease}
.tip-btn svg.i{position:relative;z-index:1;width:20px;height:20px}
.tip-btn.on .fill{height:100%}
.tip-btn.on{color:var(--ic);box-shadow:0 8px 22px -8px var(--c)}
.tip-btn:active{transform:scale(.9)}
.tip{position:absolute;left:50%;top:calc(100% + 2px);transform:translateX(-50%);padding:6px 10px;border-radius:6px;background:var(--c);color:var(--ic);font-size:12.5px;font-weight:700;white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none;transition:all .3s ease;z-index:20}
@media (hover:hover){
  .tip-item:hover .fill{height:100%}
  .tip-item:hover .tip-btn{color:var(--ic);box-shadow:0 8px 22px -8px var(--c)}
  .tip-item:hover .tip{opacity:1;visibility:visible;top:calc(100% + 10px)}
}
.tip-btn:focus-visible + .tip{opacity:1;visibility:visible;top:calc(100% + 10px)}

main{max-width:592px;margin:0 auto;padding:20px 16px 80px;display:flex;flex-direction:column;gap:16px}
.box{border-radius:24px;background:var(--panel);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 20px 25px -5px rgba(0,0,0,.4)}
.ava{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#0a0a0a;flex:none;text-transform:uppercase;border:1px solid rgba(255,255,255,.18);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
a.who:hover .ava,button.who:hover .ava{transform:scale(1.08) rotate(-4deg)}
.stack{display:flex;flex-direction:column;gap:16px}
.in{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* segmented tabs with a sliding indicator */
.seg{position:relative;display:flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;z-index:1;padding:0 16px;min-height:36px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--muted);white-space:nowrap;transition:color .3s}
.seg button[aria-selected="true"]{color:#000}
.seg .ind{position:absolute;top:4px;bottom:4px;left:0;border-radius:999px;background:#fff;transition:transform .35s cubic-bezier(.3,1.3,.5,1),width .35s cubic-bezier(.3,1.3,.5,1)}

/* composer */
.composer{padding:16px 20px;display:flex;flex-direction:column;gap:10px;transition:border-color .3s,box-shadow .3s}
.composer:focus-within{border-color:rgba(185,255,75,.4);box-shadow:0 0 0 4px rgba(185,255,75,.08),0 20px 25px -5px rgba(0,0,0,.4)}
.composer-top{display:flex;gap:12px}
.composer textarea{flex:1;min-width:0;background:none;border:0;outline:none;resize:none;font-size:16px;min-height:56px;padding:9px 0}
.composer textarea::placeholder,.inp::placeholder{color:var(--dim)}
.inp{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:0 12px;outline:none;font-size:14px;transition:border-color .2s,background .2s}
.inp:focus{border-color:rgba(185,255,75,.5);background:rgba(255,255,255,.07)}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;min-height:80px}
.link-in{animation:open .3s ease both}
@keyframes open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.composer-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ghost{height:40px;padding:0 12px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:600;transition:background .2s,color .2s}
.ghost:hover{background:var(--panel-2);color:#fff}
.count{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;transition:color .2s}
.count.warn{color:var(--save)}
.pill{height:40px;padding:0 18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:transform .2s cubic-bezier(.3,1.6,.5,1),opacity .2s,background .3s,color .3s,border-color .3s,box-shadow .3s}
.pill:hover{transform:scale(1.04);box-shadow:0 8px 24px -10px var(--accent)}
.pill:active{transform:scale(.95)}
.pill:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
.pill.line{background:rgba(255,255,255,.04);color:#fff;border:1px solid #52525b}
.pill.line:hover{border-color:#fff;box-shadow:none}
.pill.sm{height:36px;padding:0 14px;font-size:13px}
.pill svg.i{width:15px;height:15px}
.pill.flip{animation:flip .45s ease}
@keyframes flip{0%{transform:scale(1)}35%{transform:scale(.85)}70%{transform:scale(1.08)}100%{transform:scale(1)}}

/* posts */
.post{overflow:hidden}
.post.fresh{animation:rise .45s ease both,fresh 1.6s ease .2s}
@keyframes fresh{0%{box-shadow:0 0 0 0 rgba(185,255,75,.6)}100%{box-shadow:0 0 0 14px rgba(185,255,75,0)}}
.post.gone{animation:gone .35s ease forwards}
@keyframes gone{to{opacity:0;transform:scale(.94);margin-bottom:-120px}}
.post-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 0}
.who{display:flex;align-items:center;gap:12px;min-width:0;text-align:left;border-radius:12px}
.who-t{min-width:0}
.who-n{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-u{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-acts{display:flex;gap:2px;flex:none}
.icon-btn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--dim);transition:color .2s,background .2s}
.icon-btn:hover{color:var(--save);background:var(--panel-2)}
.icon-btn.saved{color:var(--save)}
.icon-btn.saved svg.i{fill:currentColor}
.icon-btn.pop svg.i{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.icon-btn.del:hover{color:var(--danger)}
.icon-btn.sure{color:var(--danger);width:auto;padding:0 10px;font-size:12px;font-weight:700;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.post-text{padding:14px 20px 16px;font-size:16px;color:var(--soft);white-space:pre-wrap;overflow-wrap:anywhere}
.linkbox{margin:0 20px 16px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);padding:14px;display:flex;align-items:flex-start;gap:12px;transition:background .2s,transform .2s,border-color .2s}
.linkbox:hover{background:rgba(63,63,70,.5);transform:translateY(-2px);border-color:#52525b}
.linkbox .lk{padding:8px;border-radius:8px;background:#3f3f46;color:var(--accent);display:flex;transition:transform .3s}
.linkbox:hover .lk{transform:rotate(-20deg)}
.linkbox b{display:block;font-size:14px}
.linkbox span{display:block;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.linkbox div{min-width:0}
.post-foot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.post-foot button{position:relative;padding:12px 0;min-height:44px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;transition:background .2s,color .2s}
.post-foot button+button{border-left:1px solid var(--line)}
.post-foot svg.i{width:16px;height:16px;transition:transform .2s}
.post-foot button:hover svg.i{transform:scale(1.15)}
.post-foot .like:hover{background:rgba(136,19,55,.45)}
.post-foot .like.on{color:var(--like);font-weight:700}
.post-foot .like.on svg.i{fill:currentColor}
.post-foot .com:hover,.post-foot .com.on{background:rgba(30,58,138,.45)}
.post-foot .com.on{color:#93c5fd}
.post-foot .rep:hover{background:rgba(20,83,45,.5)}
.post-foot .rep.on{color:var(--accent);font-weight:700}
.post-foot .pop svg.i{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(.6)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.num{display:inline-block}
.num.bump{animation:bump .4s ease}
@keyframes bump{0%{transform:translateY(0);opacity:1}45%{transform:translateY(-8px);opacity:0}55%{transform:translateY(8px);opacity:0}100%{transform:translateY(0);opacity:1}}
.spark{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--sc);pointer-events:none;animation:spark .6s ease-out forwards}
@keyframes spark{0%{transform:rotate(var(--a)) translateX(0) scale(1);opacity:1}100%{transform:rotate(var(--a)) translateX(30px) scale(0);opacity:0}}
.comments{border-top:1px solid var(--line);padding:14px 20px 16px;display:flex;flex-direction:column;gap:12px;animation:open .3s ease both}
.cm{display:flex;gap:10px}
.cm-b{min-width:0;font-size:14px;color:var(--soft);overflow-wrap:anywhere}
.cm-b button{font-weight:700;color:#fff}
.cm-b button:hover{text-decoration:underline}
.cm-b small{color:var(--dim);font-size:12px}
.cm-form{display:flex;gap:8px}
.cm-form .inp{flex:1;min-width:0}

/* skeletons */
.skel{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.sk{border-radius:8px;background:linear-gradient(90deg,rgba(255,255,255,.05) 0,rgba(255,255,255,.12) 40%,rgba(255,255,255,.05) 80%);background-size:300% 100%;animation:shimmer 1.3s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-50% 0}}
.sk-row{display:flex;align-items:center;gap:12px}

/* windows */
body.locked{overflow:hidden}
.win-layer{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.win-back{position:absolute;inset:0;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .3s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}

    refreshFollows(uid)

const wins = [];
function openWin(title, key, build) {
  const nested = wins.length > 0;
  const layer = h('div', { class: 'win-layer' });
  const back = h('div', { class: 'win-back', onclick: closeTop });
  const titleEl = h('h2', { class: 'win-title' }, title);
  const btn = h('button', { class: 'win-x' + (nested ? '' : ' close'), type: 'button', 'aria-label': nested ? 'Назад' : 'Закрыть', html: icon(nested ? 'left' : 'x'), onclick: closeTop });
  const body = h('div', { class: 'win-body' });

    h('div', { class: 'win-head' }, nested ? btn : h('span', { class: 'win-sp' }), titleEl, nested ? h('span', { class: 'win-sp' }) : btn), body);
  layer.append(back, panel);

  const w = { layer, body, key, setTitle(t) { titleEl.textContent = t; panel.setAttribute('aria-label', t); }, alive: true };
  wins.push(w);
  document.body.classList.add('locked');

}
function closeTop() { if (wins.length) history.back(); }

  if (wins.length) wins[wins.length - 1].layer.classList.remove('under');
  else document.body.classList.remove('locked');
  markNav();
  if (w.onClose) w.onClose();
}
function closeAllWins() {
  while (wins.length) { const w = wins.pop(); w.alive = false; w.layer.remove(); }
  document.body.classList.remove('locked'); markNav();
}
function toFeed() { if (wins.length) history.go(-wins.length); }

async function fetchPosts(opts) {
  let q = sb.from('posts').select(POST_SEL).order('created_at', { ascending: false }).limit(60);
  if (opts.authors) q = q.in('author_id', opts.authors.slice(0, 300));
  if (opts.ids) q = q.in('id', opts.ids.slice(0, 200));
  const r = await q;
  if (r.error) throw r.error;
  const posts = r.data, ids = posts.map((p) => p.id);
  let mine = [[], [], []];
  if (ids.length) {
    const uid = state.me.id;
    const rs = await Promise.all(['likes', 'reposts', 'bookmarks'].map((t) => sb.from(t).select('post_id').eq('user_id', uid).in('post_id', ids)));
    mine = rs.map((x) => (x.data || []).map((y) => y.post_id));
  }
  for (const p of posts) {
    p.nLikes = p.likes[0] ? p.likes[0].count : 0;
    p.nComments = p.comments[0] ? p.comments[0].count : 0;
    p.nReposts = p.reposts[0] ? p.reposts[0].count : 0;
    p.liked = mine[0].includes(p.id); p.reposted = mine[1].includes(p.id); p.saved = mine[2].includes(p.id);
  }
  if (opts.ids) { const order = new Map(opts.ids.map((id, i) => [id, i])); posts.sort((a, b) => order.get(a.id) - order.get(b.id)); }
  return posts;
}

      const friends = following.filter((id) => state.followers.has(id));
      if (tab === 'friends') {
        fillPeople(content, friends, alive, emptyBox('users', 'Пока нет друзей', 'Друзья — это те, на кого подписан ты и кто подписан на тебя.', h('button', { class: 'pill sm', type: 'button', onclick: () => pick('search'), html: icon('search') }, 'Найти людей')));
      } else if (tab === 'followers') {
        fillPeople(content, followers, alive, emptyBox('users', 'Пока нет подписчиков', 'Публикуй посты, и люди начнут подписываться.'));
      } else {
        fillPeople(content, following, alive, emptyBox('plus', 'Ты пока ни на кого не подписан', '', h('button', { class: 'pill sm', type: 'button', onclick: () => pick('search'), html: icon('search') }, 'Найти людей')));
      }
    };
    const tabsWrap = h('div');
    const pick = (id) => { tab = id; tabsWrap.textContent = ''; tabsWrap.append(makeTabs()); show(); };
    const makeTabs = () => segTabs([['friends', 'Друзья'], ['followers', 'Подписчики'], ['following', 'Подписки'], ['search', 'Поиск']], tab, (id) => { tab = id; show(); });
    tabsWrap.append(makeTabs());
    body.append(tabsWrap, content);
    show();
  });
}
function showSearch(content, alive) {
  const input = h('input', { class: 'inp', id: 'people-q', type: 'search', placeholder: 'Имя или @юзернейм', 'aria-label': 'Поиск людей' });
  const list = h('div', { class: 'list' });
  let t, n = 0;
  const run = async () => {
    const my = ++n;
    const term = input.value.trim().replace(/^@/, '').replace(/[,()%*\\]/g, '');
    let q = sb.from('profiles').select(P).limit(40);
    q = term ? q.or(`username.ilike.%${term}%,name.ilike.%${term}%`).order('username') : q.order('created_at', { ascending: false });
    const r = await q;
    if (!alive() || my !== n) return;
    list.textContent = '';
    if (r.error) return list.append(h('div', { class: 'empty err' }, ruError(r.error)));
    const rows = r.data.filter((u) => u.id !== state.me.id);
    if (!rows.length) return list.append(emptyBox('search', term ? 'Никого не нашлось' : 'Ты здесь первый', term ? 'Проверь, как написан юзернейм.' : 'Позови друзей: дай им ссылку на сайт.'));
    if (!term) list.append(h('div', { class: 'h', style: 'margin:4px 6px 6px' }, 'Новые в mynet'));
    rows.forEach((u, i) => list.append(personRow(u, i)));
  };
  input.addEventListener('input', () => { clearTimeout(t); t = setTimeout(run, 250); });
  content.append(h('div', { class: 'in', style: 'margin-bottom:8px' }, input), list);
  setTimeout(() => input.focus({ preventScroll: true }), 80);
  run();
}

/* ---------- saved window ---------- */
function openSaved() {
  openWin('Сохранённое', 'saved', async (body, w) => {
    const holder = h('div', { class: 'stack' }, skeleton(2));
    body.append(holder);
    const r = await sb.from('bookmarks').select('post_id').eq('user_id', state.me.id).order('created_at', { ascending: false }).limit(60);
    if (!w.alive) return;
    if (r.error) { holder.textContent = ''; return holder.append(h('div', { class: 'empty err' }, ruError(r.error))); }
    const empty = emptyBox('bookmark', 'Ничего не сохранено', 'Нажми на закладку в углу поста. Сохранённое видишь только ты.');
    if (!r.data.length) { holder.textContent = ''; return holder.append(empty); }
    listPosts(holder, { ids: r.data.map((x) => x.post_id) }, () => w.alive, empty);
  });
}

/* ---------- profile window ---------- */
function openPeopleList(title, ids, emptyText) {
  openWin(title, 'list', (body, w) => {
    const list = h('div', { class: 'list' });
    body.append(list);
    fillPeople(list, ids, () => w.alive, emptyBox('users', emptyText, ''));
  });
}
function openProfile(username) {
  const mine = state.me && username === state.me.username;
  openWin('Профиль', mine ? 'me' : 'profile', async (body, w) => {
    body.append(skeleton(1));
    const load = async () => {
      const r = await sb.from('profiles').select(P + ',bio,created_at,is_admin').eq('username', username).maybeSingle();
      if (!w.alive) return;
      body.textContent = '';
      if (r.error || !r.data) return body.append(emptyBox('user', 'Профиль не найден', 'Аккаунта @' + username + ' нет в mynet.'));
      const u = r.data, isMe = u.id === state.me.id;
      w.setTitle('@' + u.username);
      const [fr, fg, pc] = await Promise.all([
        sb.from('follows').select('follower_id').eq('following_id', u.id).limit(1000),
        sb.from('follows').select('following_id').eq('follower_id', u.id).limit(1000),
        sb.from('posts').select('*', { count: 'exact', head: true }).eq('author_id', u.id)
      ]);
      if (!w.alive) return;
      const followers = (fr.data || []).map((x) => x.follower_id);
      const following = (fg.data || []).map((x) => x.following_id);
      const fset = new Set(followers);
      const friends = following.filter((id) => fset.has(id));
      const hh = hue(u.username);
      const banner = h('div', { class: 'pf-banner', style: `background-image:linear-gradient(120deg,hsl(${hh} 85% 60%),hsl(${(hh + 60) % 360} 80% 45%),hsl(${(hh + 150) % 360} 75% 50%),hsl(${hh} 85% 60%))` });
      const head = h('div', { class: 'pf-top' }, h('div', { class: 'pf-ava' }, avatar(u, 92)));
      const actions = h('div', { class: 'pf-acts' });
      const nameRow = h('div', { class: 'pf-name' }, h('h3', null, u.name));
      const nameBadge = h('span', { class: 'pf-badge' });
      const drawBadge = () => { nameBadge.textContent = ''; const b = badge(u, true); if (b) nameBadge.append(b); };
      drawBadge(); nameRow.append(nameBadge);
      if (u.is_admin) nameRow.append(h('span', { class: 'chip admin', html: icon('shield') }, 'админ'));
      const drawRel = () => {
        nameRow.querySelectorAll('.chip:not(.admin)').forEach((c) => c.remove());
        const c = isMe ? null : relChip(u);
        if (c) nameRow.append(c.textContent === 'друг' ? h('span', { class: 'chip friend', html: icon('users') }, 'вы друзья') : c);
      };
      const statEls = {};
      const stat = (key, label, n, fn) => {
        const b = h(fn ? 'button' : 'div', { class: 'stat', type: fn ? 'button' : null, onclick: fn || null, style: `animation-delay:${Object.keys(statEls).length * 60 + 120}ms` });
        const num = h('b', null, '0'); b.append(num, h('span', null, label));
        statEls[key] = num; countUp(num, n);
        return b;
      };
      if (isMe) actions.append(h('button', { class: 'pill sm line', type: 'button', onclick: () => openEdit(u, () => { closeTop(); setTimeout(() => { body.textContent = ''; body.append(skeleton(1)); username = state.me.username; load(); renderFeed(); }, 300); }) }, 'Редактировать'));
      else actions.append(followBtn(u, (d) => {
        if (d > 0) followers.push(state.me.id); else followers.splice(followers.indexOf(state.me.id), 1);
        countUp(statEls.followers, followers.length);
        const fr2 = following.filter((id) => new Set(followers).has(id));
        countUp(statEls.friends, fr2.length); friends.splice(0, friends.length, ...fr2);
        drawRel();
      }));
      if (state.me.is_admin) actions.append(badgeBtn(u, drawBadge));
      if (isMe && state.me.is_admin) actions.append(h('button', { class: 'pill sm line', type: 'button', 'aria-label': 'Админ-панель', title: 'Админ-панель', html: icon('shield'), onclick: openAdmin }));
      head.append(actions);
      drawRel();
      const sinceD = new Date(u.created_at), since = isNaN(sinceD) ? '' : sinceD.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
      const stats = h('div', { class: 'stats' },
        stat('posts', plural(pc.count || 0, 'пост', 'поста', 'постов'), pc.count || 0),
        stat('followers', 'подписчики', followers.length, () => openPeopleList('Подписчики @' + u.username, followers, 'Пока нет подписчиков')),
        stat('following', 'подписки', following.length, () => openPeopleList('Подписки @' + u.username, following, 'Пока нет подписок')),
        stat('friends', 'друзья', friends.length, () => openPeopleList('Друзья @' + u.username, friends, 'Пока нет друзей')));
      const holder = h('div', { class: 'stack' });
      const showTab = async (id) => {
        if (id === 'posts') return listPosts(holder, { authors: [u.id] }, () => w.alive, emptyBox('spark', isMe ? 'У тебя пока нет постов' : 'Постов пока нет', isMe ? 'Напиши что-нибудь в ленте.' : ''));
        holder.textContent = ''; holder.append(skeleton(1));
        const lk = await sb.from('likes').select('post_id').eq('user_id', u.id).order('created_at', { ascending: false }).limit(60);
        if (!w.alive) return;
        const empty = emptyBox('heart', 'Пока ничего не понравилось', '');
        if (lk.error || !lk.data.length) { holder.textContent = ''; return holder.append(lk.error ? h('div', { class: 'empty err' }, ruError(lk.error)) : empty); }
        listPosts(holder, { ids: lk.data.map((x) => x.post_id) }, () => w.alive, empty);
      };
      body.append(banner, head,
        h('div', { class: 'in', style: 'display:flex;flex-direction:column;gap:6px;animation-delay:80ms' }, nameRow, h('div', { class: 'pf-u' }, '@' + u.username),
          u.bio ? h('div', { class: 'pf-bio' }, u.bio) : null,
          since ? h('div', { class: 'pf-since', html: icon('cal') }, 'В mynet с ' + since) : null),
        stats,
        h('div', { class: 'in', style: 'animation-delay:300ms' }, segTabs([['posts', 'Посты'], ['likes', 'Нравится']], 'posts', showTab)),
        holder);
      showTab('posts');
    };
    load();
  });
}
function openEdit(u, done) {
  openWin('Редактировать профиль', 'me', (body) => {
    const name = h('input', { class: 'inp', id: 'e-name', maxlength: '40', value: u.name });
    const uname = h('input', { class: 'inp', id: 'e-username', maxlength: '20', value: u.username, autocapitalize: 'none', spellcheck: 'false' });
    const bio = h('textarea', { class: 'inp', id: 'e-bio', maxlength: '160' }); bio.value = u.bio || '';
    const left = h('span', { class: 'count' }, (160 - bio.value.length) + ' осталось');
    const msg = h('div', { class: 'err', role: 'alert' });
    const prev = h('div', { class: 'ava-edit' });
    let newAvatar, avatarPath = u.avatar_path || null, avBusy = false;
    const avPick = h('input', { type: 'file', id: 'e-avatar', accept: 'image/*', hidden: true });
    const drawPrev = () => {
      prev.textContent = '';
      const a = avatar({ username: uname.value || u.username, name: name.value || u.name, avatar_path: avatarPath }, 96);
      if (avBusy) a.append(h('span', { class: 'ava-busy' }, h('span', { class: 'spin' })));
      prev.append(a, h('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;justify-content:center' },
        h('button', { class: 'pill sm line', type: 'button', html: icon('image'), onclick: () => avPick.click() }, avatarPath ? 'Сменить фото' : 'Загрузить фото'),
        avatarPath ? h('button', { class: 'pill sm line', type: 'button', onclick: () => { avatarPath = null; drawPrev(); } }, 'Убрать') : null), avPick);
    };
    avPick.addEventListener('change', async () => {
      const f = avPick.files[0]; avPick.value = '';
      if (!f) return;
      if (!f.type.startsWith('image/')) return toast('Для аватарки нужна картинка');
      if (f.size > 10 * 1024 * 1024) return toast('Фото должно быть меньше 10 МБ');
      avBusy = true; drawPrev();
      try { const [m] = await uploadFiles([f]); if (newAvatar) sb.storage.from(BUCKET).remove([newAvatar]); newAvatar = m.path; avatarPath = m.path; }
      catch (e) { toast('Не получилось загрузить фото: ' + ruError(e)); }
      avBusy = false; drawPrev();
    });
    drawPrev();
    name.addEventListener('input', drawPrev);
    uname.addEventListener('input', () => { uname.value = uname.value.toLowerCase().replace(/[^a-z0-9_]/g, ''); drawPrev(); });
    bio.addEventListener('input', () => { left.textContent = (160 - bio.value.length) + ' осталось'; });
    const save = h('button', { class: 'pill sm', type: 'submit' }, 'Сохранить');
    const form = h('form', { class: 'edit in' }, prev,
      h('label', null, 'Имя', name),
      h('label', null, 'Юзернейм', h('div', { class: 'at-wrap' }, h('span', null, '@'), uname), h('span', { class: 'count' }, 'Латинские буквы, цифры и _ , от 3 до 20 символов')),
      h('label', null, 'О себе', bio, left), msg,
      h('div', { class: 'edit-acts' }, h('button', { class: 'pill sm line', type: 'button', onclick: closeTop }, 'Отмена'), save));
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const next = { name: name.value.trim(), username: uname.value.trim(), bio: bio.value.trim(), avatar_path: avatarPath };
      if (!next.name) { msg.textContent = 'Напиши имя.'; return; }
      if (!/^[a-z0-9_]{3,20}$/.test(next.username)) { msg.textContent = 'Юзернейм: латинские буквы, цифры и _ , от 3 до 20 символов.'; return; }
      save.disabled = true;
      const q = await sb.from('profiles').update(next).eq('id', u.id);
      save.disabled = false;
      if (q.error) { msg.textContent = ruError(q.error); return; }
      if (u.avatar_path && u.avatar_path !== next.avatar_path && u.avatar_path.startsWith(state.me.id + '/')) sb.storage.from(BUCKET).remove([u.avatar_path]);
      Object.assign(state.me, next); toast('Профиль сохранён'); done();
    });
    body.append(form);
  });
}
